[project]
name = "vibesight"
version = "0.1.0"
description = "Gerçek zamanlı sınıf/oda atmosferi analizi — kişi sayımı, yüz ifadesi, enerji ve dikkat göstergeleri."
authors = [{ name = "Eren KADİROĞLU" }]
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.19",
  "mediapipe>=0.10.14",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
vibesight = "vibesight.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibesight"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
